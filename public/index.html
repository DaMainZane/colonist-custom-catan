<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Colonist Custom: Online Catan with Bots and a Map Painter</title>
  <meta name="description" content="Customizable online multiplayer Catan with bots, full trading and a custom map painter" />
  <meta property="og:title" content="Colonist Custom: Online Catan with Bots and a Map Painter" />
  <meta property="og:description" content="Customizable online multiplayer Catan with bots, full trading and a custom map painter" />
  <script>
    // Apply the saved theme before first paint so the page never flashes the wrong one.
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>

  <!-- 1. LANDING -->
  <div id="authScreen">
    <button class="nav-btn auth-theme" onclick="toggleTheme()" title="Light or dark theme"><span data-icon="theme"></span></button>
    <div class="auth-card">
      <h1 class="brand"><span data-glyph="wood"></span> Colonist Custom</h1>
      <p>Bots, full trading and a custom map painter</p>
      <div class="stack">
        <input id="playerNameInput" class="text-input" type="text" placeholder="Nickname" maxlength="15" value="AvocadoMan" />
        <button class="btn primary" onclick="createRoom()"><span data-icon="plus" data-size="18"></span>Create game</button>
        <!-- Filled from an invite link (?room=CODE). Otherwise Join takes the newest open lobby. -->
        <input id="roomCodeInput" type="hidden" />
        <button class="btn" onclick="joinRoom()"><span data-icon="users" data-size="18"></span>Join game</button>
      </div>
    </div>
  </div>

  <!-- 2. GAME -->
  <div id="gameViewport">
    <div class="board-stage" id="boardStage">

      <!-- Navigation -->
      <div class="left-nav">
        <button class="nav-btn" onclick="copyInviteLink()" title="Copy invite link"><span data-icon="link"></span></button>
        <button class="nav-btn" id="btnToggleSound" onclick="toggleSound()" title="Sound"><span data-icon="sound"></span></button>
        <button class="nav-btn" onclick="toggleTheme()" title="Light or dark theme"><span data-icon="theme"></span></button>
        <button class="nav-btn" onclick="resetCamera()" title="Fit board to screen"><span data-icon="fit"></span></button>
        <button class="nav-btn" id="btnQuickSpeed" onclick="toggleGameMenu()" title="Game menu"><span data-icon="home"></span></button>
        <button class="nav-btn" id="btnToggleEditor" onclick="toggleLobbyToolbar()" title="Lobby settings"><span data-icon="sliders"></span></button>
      </div>

      <!-- In-game menu -->
      <div id="gameSettingsMenu" class="game-settings-menu" style="display:none;">
        <div class="menu-head">
          <span>Game menu</span>
          <button class="icon-btn" onclick="toggleGameMenu(false)" title="Close"><span data-icon="close" data-size="18"></span></button>
        </div>
        <div class="menu-actions">
          <button class="btn sm" onclick="resetCamera()"><span data-icon="fit" data-size="16"></span>Fit board</button>
          <button class="btn sm" id="btnBackToLobby" onclick="rematchLobby()"><span data-icon="refresh" data-size="16"></span>Back to lobby</button>
        </div>
      </div>

      <!-- Reopen victory stats when inspecting the map after the game -->
      <button id="reopenVictoryBtn" class="btn" onclick="toggleVictoryMapInspect(false)"><span data-icon="users" data-size="18"></span>Show results</button>

      <!-- Victory and post-game stats -->
      <div id="victoryOverlay">
        <div class="vic-top-bar">
          <div class="vic-spacer"></div>
          <div class="vic-center">
            <div class="vic-logo-badge">COLONIST CUSTOM</div>
            <h2 id="vicTitleText" class="vic-title">Victory!</h2>
            <p id="vicSubText" class="vic-sub">Time: 00:00 - Turns: 0</p>
          </div>
          <div class="vic-side">
            <button class="btn vic-btn-dark" onclick="toggleVictoryMapInspect(true)"><span data-icon="map" data-size="18"></span>Map / Replay</button>
            <button class="btn primary" onclick="copyInviteLink()"><span data-icon="link" data-size="18"></span>Share</button>
          </div>
        </div>

        <div class="vic-tabs">
          <button class="vic-tab active" data-vtab="overview" onclick="switchVictoryTab('overview')">Overview</button>
          <button class="vic-tab" data-vtab="dice" onclick="switchVictoryTab('dice')">Dice Stats</button>
          <button class="vic-tab" data-vtab="res_cards" onclick="switchVictoryTab('res_cards')">Res Card Stats</button>
          <button class="vic-tab" data-vtab="dev_cards" onclick="switchVictoryTab('dev_cards')">Dev Card Stats</button>
          <button class="vic-tab" data-vtab="activity" onclick="switchVictoryTab('activity')">Activity Stats</button>
          <button class="vic-tab" data-vtab="resources" onclick="switchVictoryTab('resources')">Resource Stats</button>
        </div>

        <div class="vic-body" id="vicChartContainer"></div>

        <div class="vic-actions">
          <button class="btn vic-btn-dark" onclick="window.location.reload()"><span data-icon="home" data-size="18"></span>Home</button>
          <button class="btn primary" onclick="rematchLobby()"><span data-icon="refresh" data-size="18"></span>Play again</button>
        </div>
      </div>

      <!-- Lobby dock: map painter and rules -->
      <div id="lobbyToolbar">
        <div class="dock-head">
          <div class="tabs">
            <button class="tab active" id="tabBtnMap" onclick="switchLobbyTab('map')">Map painter</button>
            <button class="tab" id="tabBtnCards" onclick="switchLobbyTab('cards')">Rules and cards</button>
          </div>
          <div class="dock-actions">
            <select id="botTier" class="num" title="Difficulty of the next bot (click a bot's tag in the player list to change it later)">
              <option value="main" selected>Main</option>
              <option value="secondary">Secondary</option>
              <option value="overload">Overload</option>
            </select>
            <button class="btn sm" onclick="addBot()"><span data-icon="plus" data-size="16"></span>Bot</button>
            <button class="btn sm" onclick="removeBot()"><span data-icon="minus" data-size="16"></span>Bot</button>
            <button class="btn sm primary" onclick="startGame()"><span data-icon="play" data-size="16"></span>Start</button>
          </div>
        </div>

        <!-- Presets: built-in ones are fixed, saved ones (host's browser) can be deleted after a confirmation -->
        <div class="tool-row" id="presetRow">
          <span class="tool-label">Presets</span>
          <button class="chip-btn" onclick="applyPreset('standard')">Standard</button>
          <button class="chip-btn" onclick="applyPreset('goldRush')">Gold rush</button>
          <button class="chip-btn" onclick="applyPreset('fogIsland')">Fog island</button>
          <button class="chip-btn" onclick="applyPreset('archipelago')">Islands</button>
          <button class="chip-btn" onclick="applyPreset('blank')">Blank ocean</button>
          <span class="tool-sep"></span>
          <span id="customPresets" class="tool-row"></span>
        </div>

        <!-- Tab 1: map painter -->
        <div id="lobbyTabMap" class="dock-body">
          <div class="tool-row">
            <span class="tool-label">Tiles</span>
            <button class="brush-btn swatch t-wood" title="Wood" onclick="setBrush('terrain','wood',this)"><span data-glyph="wood"></span></button>
            <button class="brush-btn swatch t-brick" title="Brick" onclick="setBrush('terrain','brick',this)"><span data-glyph="brick"></span></button>
            <button class="brush-btn swatch t-sheep" title="Sheep" onclick="setBrush('terrain','sheep',this)"><span data-glyph="sheep"></span></button>
            <button class="brush-btn swatch t-wheat" title="Wheat" onclick="setBrush('terrain','wheat',this)"><span data-glyph="wheat"></span></button>
            <button class="brush-btn swatch t-ore" title="Ore" onclick="setBrush('terrain','ore',this)"><span data-glyph="ore"></span></button>
            <button class="brush-btn swatch t-gold" title="Gold" onclick="setBrush('terrain','gold',this)"><span data-glyph="gold"></span></button>
            <button class="brush-btn swatch t-desert" title="Desert" onclick="setBrush('terrain','desert',this)"><span data-glyph="desert"></span></button>
            <button class="brush-btn swatch t-fog" title="Fog" onclick="setBrush('terrain','fog',this)"><span data-glyph="fog"></span></button>
            <button class="brush-btn swatch t-water" title="Ocean (erase)" onclick="setBrush('terrain','water',this)"><span data-icon="waves" data-size="22"></span></button>
            <span class="tool-sep"></span>
            <button class="brush-btn swatch t-any" title="Place robber" onclick="setBrush('robber','robber',this)"><span data-robber></span></button>
          </div>
          <div class="tool-row">
            <span class="tool-label">Numbers</span>
            <button class="brush-btn" onclick="setBrush('number','2',this)">2</button>
            <button class="brush-btn" onclick="setBrush('number','3',this)">3</button>
            <button class="brush-btn" onclick="setBrush('number','4',this)">4</button>
            <button class="brush-btn" onclick="setBrush('number','5',this)">5</button>
            <button class="brush-btn hot" onclick="setBrush('number','6',this)">6</button>
            <button class="brush-btn hot" onclick="setBrush('number','8',this)">8</button>
            <button class="brush-btn" onclick="setBrush('number','9',this)">9</button>
            <button class="brush-btn" onclick="setBrush('number','10',this)">10</button>
            <button class="brush-btn" onclick="setBrush('number','11',this)">11</button>
            <button class="brush-btn" onclick="setBrush('number','12',this)">12</button>
            <button class="brush-btn swatch t-any" title="Clear number" onclick="setBrush('number','none',this)"><span data-icon="close" data-size="18"></span></button>
          </div>
          <div class="tool-row">
            <span class="tool-label">Ports</span>
            <button class="brush-btn swatch has-ratio t-any" title="3:1 any resource" onclick="setBrush('port','3:1',this)"><span class="ratio">3:1</span></button>
            <button class="brush-btn swatch has-ratio t-wood" title="Wood 2:1" onclick="setBrush('port','wood',this)"><span data-glyph="wood"></span><span class="ratio">2:1</span></button>
            <button class="brush-btn swatch has-ratio t-brick" title="Brick 2:1" onclick="setBrush('port','brick',this)"><span data-glyph="brick"></span><span class="ratio">2:1</span></button>
            <button class="brush-btn swatch has-ratio t-sheep" title="Sheep 2:1" onclick="setBrush('port','sheep',this)"><span data-glyph="sheep"></span><span class="ratio">2:1</span></button>
            <button class="brush-btn swatch has-ratio t-wheat" title="Wheat 2:1" onclick="setBrush('port','wheat',this)"><span data-glyph="wheat"></span><span class="ratio">2:1</span></button>
            <button class="brush-btn swatch has-ratio t-ore" title="Ore 2:1" onclick="setBrush('port','ore',this)"><span data-glyph="ore"></span><span class="ratio">2:1</span></button>
            <button class="brush-btn swatch t-any" title="Remove port" onclick="setBrush('port','none',this)"><span data-icon="close" data-size="18"></span></button>
          </div>
        </div>

        <!-- Tab 2: rules and card amounts -->
        <div id="lobbyTabCards" class="dock-body" style="display:none;">
          <div class="rules-grid">
            <div class="rule-group">
              <h4>Game</h4>
              <label class="field">Map radius (1-50)<input id="setRadius" type="number" class="num" value="2" min="1" max="50" onchange="pushSettings()" /></label>
              <label class="field">VP to win<input id="setVp" type="number" class="num" value="10" min="3" max="50" onchange="pushSettings()" /></label>
              <label class="field">Max players<input id="setMaxP" type="number" class="num" value="8" min="2" max="8" onchange="pushSettings()" /></label>
              <label class="field">Discard above<input id="setDiscard" type="number" class="num" value="7" min="3" max="50" onchange="pushSettings()" /></label>
            </div>
            <div class="rule-group">
              <h4>Timers</h4>
              <label class="field" title="Seconds per turn. 0 = no turn timer.">Turn time (sec, 0 = off)<input id="setTurnTime" type="number" class="num" value="0" min="0" max="900" onchange="pushSettings()" /></label>
              <label class="field" title="Seconds added to your turn each time you complete an action.">+ sec per action<input id="setTurnInc" type="number" class="num" value="0" min="0" max="120" onchange="pushSettings()" /></label>
              <label class="field" title="How long a trade offer stays open.">Trade offer (sec)<input id="setTradeTime" type="number" class="num" value="20" min="5" max="300" onchange="pushSettings()" /></label>
            </div>
            <div class="rule-group">
              <h4>Bots</h4>
              <label class="field" title="How much bots talk in chat. Off also stops their replies to your messages.">Bot chat
                <select id="setBotChat" class="num" onchange="pushSettings()">
                  <option value="off">Off</option>
                  <option value="quiet">Quiet</option>
                  <option value="normal" selected>Normal</option>
                  <option value="chatty">Chatty</option>
                </select>
              </label>
            </div>
            <div class="rule-group">
              <h4>Special tiles</h4>
              <label class="field">Gold hexes<input id="setGold" type="number" class="num" value="0" min="0" max="500" onchange="pushSettings()" /></label>
              <label class="field">Desert hexes<input id="setDesert" type="number" class="num" value="1" min="0" max="200" onchange="pushSettings()" /></label>
              <label class="field">Fog hexes<input id="setFog" type="number" class="num" value="0" min="0" max="2000" onchange="pushSettings()" /></label>
            </div>
            <div class="rule-group">
              <h4>Bank and dev cards</h4>
              <label class="field">Bank cards per type<input id="setBankRes" type="number" class="num" value="19" min="5" max="999" onchange="pushSettings()" /></label>
              <label class="field">Knights<input id="setDevKnight" type="number" class="num" value="14" min="0" max="100" onchange="pushSettings()" /></label>
              <label class="field">Victory points<input id="setDevVp" type="number" class="num" value="5" min="0" max="50" onchange="pushSettings()" /></label>
              <label class="field">Road building<input id="setDevRb" type="number" class="num" value="2" min="0" max="50" onchange="pushSettings()" /></label>
              <label class="field">Year of plenty<input id="setDevYop" type="number" class="num" value="2" min="0" max="50" onchange="pushSettings()" /></label>
              <label class="field">Monopoly<input id="setDevMono" type="number" class="num" value="2" min="0" max="50" onchange="pushSettings()" /></label>
            </div>
            <div class="rule-group">
              <h4>Pieces per player</h4>
              <label class="field">Roads<input id="setMaxRoad" type="number" class="num" value="15" min="5" max="50" onchange="pushSettings()" /></label>
              <label class="field">Settlements<input id="setMaxSettle" type="number" class="num" value="5" min="2" max="20" onchange="pushSettings()" /></label>
              <label class="field">Cities<input id="setMaxCity" type="number" class="num" value="4" min="1" max="20" onchange="pushSettings()" /></label>
            </div>
          </div>
        </div>
      </div>

      <!-- Hint bar -->
      <div id="hintBar"></div>

      <!-- Active trade offer -->
      <div id="activeTradeModal"></div>

      <!-- Board -->
      <svg id="boardSvg" viewBox="-500 -450 1000 900"></svg>
      <div id="roadHoverTooltip" class="road-hover-tooltip"></div>

      <!-- Bottom-left sheet and trade confirm buttons -->
      <div id="inlineDrawerWrap">
        <div id="inlineDrawer"></div>
        <div id="tradeConfirmStack">
          <button class="trade-side-btn" id="btnExecBankTrade" onclick="executeBankTrade()" title="Trade with bank or port">
            <span data-icon="bank" data-size="22"></span>
            <span>Bank</span>
          </button>
          <button class="trade-side-btn" id="btnExecPlayerTrade" onclick="proposePlayerTrade()" title="Offer trade to players and bots">
            <span data-icon="users" data-size="22"></span>
            <span>Players</span>
          </button>
        </div>
      </div>

      <!-- Hand -->
      <div class="hand-panel" id="myHandPanel"></div>

      <!-- Dice, turn pill and actions -->
      <div class="center-hud">
        <div class="dice-pair" id="dicePair" onclick="rollDice()" title="Roll dice">
          <div class="die-box" id="die1"></div>
          <div class="die-box" id="die2"></div>
        </div>
        <div class="turn-pill" id="turnStatusPill">Waiting in lobby</div>
        <div class="action-bar">
          <button class="act-btn primary" id="btnConfirmAction" style="display:none;" onclick="confirmInlineAction()" title="Confirm"><span data-icon="check" data-size="22"></span></button>
          <button class="act-btn danger" id="btnCancelAction" style="display:none;" onclick="closeInlineDrawer()" title="Cancel"><span data-icon="close" data-size="22"></span></button>
          <button class="act-btn" id="btnTradeDrawer" onclick="toggleTradeDrawer()" title="Trade">
            <span data-icon="swap" data-size="22"></span><span class="lbl">Trade</span>
          </button>
          <button class="act-btn" id="btnBuyDev" onclick="buyDevCard()" title="Buy dev card (1 sheep, 1 wheat, 1 ore)">
            <span data-icon="devbuy" data-size="22"></span><span class="lbl">Dev</span>
          </button>
          <button class="act-btn" id="btnBuildRoad" onclick="setBuildMode('road')" title="Build road (1 wood, 1 brick)">
            <span class="piece-badge" id="badgeRoadCnt">15</span>
            <span data-icon="road" data-size="22"></span><span class="lbl">Road</span>
          </button>
          <button class="act-btn" id="btnBuildSettle" onclick="setBuildMode('settlement')" title="Build settlement (1 wood, 1 brick, 1 sheep, 1 wheat)">
            <span class="piece-badge" id="badgeSettleCnt">5</span>
            <span data-icon="house" data-size="22"></span><span class="lbl">Settle</span>
          </button>
          <button class="act-btn" id="btnBuildCity" onclick="setBuildMode('city')" title="Build city (2 wheat, 3 ore)">
            <span class="piece-badge" id="badgeCityCnt">4</span>
            <span data-icon="city" data-size="22"></span><span class="lbl">City</span>
          </button>
          <button class="act-btn" id="btnMainTurnAction" onclick="mainTurnButton()" title="Roll or pass">
            <span id="mainBtnIcon" data-icon="dice" data-size="22"></span><span class="lbl" id="mainBtnLbl">Roll</span>
          </button>
        </div>
      </div>

    </div>

    <!-- Right sidebar -->
    <div class="right-sidebar">
      <div id="logSection"></div>
      <div id="chatSection">
        <div id="chatFeed"></div>
        <div class="chat-input-wrap">
          <input id="chatInput" type="text" placeholder="Send a message" onkeydown="if(event.key==='Enter') sendChat()" />
        </div>
      </div>
      <div class="bank-bar" id="bankBar"></div>
      <div class="players-stack" id="playersStack"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
